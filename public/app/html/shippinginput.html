<div class="row">
    <div class="col-md-12 grid-margin">
        <div class="d-flex justify-content-between flex-wrap">
            <div class="d-flex align-items-end flex-wrap">
                <div class="mr-md-3 mr-xl-3">
                    <h2 class="m-b-8">SHIPMENT PROCESS.</h2>
                    <p class="mb-md-0">Product shipping process of Asian Cargo.</p>
                </div>
                <div class="shipment-number-border">
                    <h1 class="shipment-number" id="shipment-number">000</h1>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-end flex-wrap">

                <div class="ui floating dropdown labeled search icon button btn btn-inverse-secondary" id="exporter" style="height: 55px">
                    <i class="mdi mdi-account-outline mdi-24px icon"></i>
                    <span class="default text">Exporter</span>
                    <div class="menu">
                        <div class="item text-primary btn-inverse-primary">ADD EXPORTER</div>
                    </div>
                </div>

                <button class="btn btn-inverse-secondary btn-icon-text show-messages m-r-20 m-l-20" id="reset">
                    <i class="mdi mdi-autorenew btn-icon-prepend mdi-24px"></i>
                    <span class="d-inline-block text-left font-weight-bold">Reset<small class="font-weight-light d-block m-t-3">for reset process.</small></span>
                </button>

                <button class="btn btn-outline-dark btn-icon-text m-r-20" data-toggle="modal" data-target="#shipmetnattachement">
                    <i class="mdi mdi-link-variant btn-icon-prepend mdi-24px"></i>
                    <span class="d-inline-block text-left font-weight-bold">Attachment<small class="font-weight-light d-block m-t-3">for excel sheet.</small></span>
                </button>



                <button class="btn btn-outline-dark btn-icon-text generate-courier-report align-middle" id="sync">
                    <i class="fa fa-refresh btn-icon-prepend"></i>
                    <span class="d-inline-block text-left font-weight-bold">Sync<small class="font-weight-light d-block m-t-3">for Shipment.</small></span>
                </button>

            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body dashboard-tabs p-0">
                <div class="tab-content py-0 px-0">
                    <div class="tab-pane fade show active" id="overview" role="tabpanel" aria-labelledby="overview-tab">
                        <div class="d-flex flex-wrap justify-content-xl-between nav nav-tabs"  role="tablist">
                            <a class="d-flex d-xl-flex border-md-right flex-grow-1 align-items-center justify-content-center p-3 item bg-light tab-pointer text-decoration-none nav-item active">
                                <i class="mdi mdi-account-outline icon-lg mr-3 text-primary"></i>
                                <div class="d-flex flex-column justify-content-around">
                                    <small class="mb-1 text-muted">Customers</small>
                                    <div class="dropdown">
                                        <div class="btn btn-secondary p-0 bg-transparent border-0 text-dark shadow-none font-weight-medium">
                                            <h5 class="mb-0 d-inline-block total-customer">0</h5>
                                        </div>
                                    </div>
                                </div>
                            </a>
                            <a class="d-flex border-md-right flex-grow-1 align-items-center justify-content-center p-3 item tab-pointer text-decoration-none nav-item">
                                <i class="mdi mdi-cube-outline mr-3 icon-lg text-danger"></i>
                                <div class="d-flex flex-column justify-content-around">
                                    <small class="mb-1 text-muted">Products</small>
                                    <div class="">
                                        <div class="btn btn-secondary p-0 bg-transparent border-0 text-dark shadow-none font-weight-medium">
                                            <h5 class="mb-0 d-inline-block total-product">0</h5>
                                        </div>
                                    </div>
                                </div>
                            </a>
                            <a class="d-flex border-md-right flex-grow-1 align-items-center justify-content-center p-3 item tab-pointer text-decoration-none nav-item">
                                <i class="mdi mdi-weight-kilogram mr-3 icon-lg text-success"></i>
                                <div class="d-flex flex-column justify-content-around">
                                    <small class="mb-1 text-muted">Weight</small>
                                    <div class="dropdown">
                                        <div class="btn btn-secondary p-0 bg-transparent border-0 text-dark shadow-none font-weight-medium">
                                            <h5 class="mb-0 d-inline-block total-weight">0</h5>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="tab-content grid-margin">

    <div class="card table-responsive p-10" style="min-height: calc(100vh - 340px)">
        <table class="table table-striped table-bordered main-table" style="z-index: 1;" id="dataTable">
            <thead>
                <tr>
                    <th class="font-weight-bold" style="width: 25%">Name</th>
                    <th class="font-weight-bold" style="width: 10%">Contact</th>
                    <th class="font-weight-bold" style="width: 5%">Cartons</th>
                    <th class="font-weight-bold" style="width: 25%">Name</th>
                    <th class="font-weight-bold" style="width: 10%">Category</th>
                    <th class="font-weight-bold" style="width: 10%">Quantity</th>
                    <th class="font-weight-bold text-center" style="width: 7%">Unit</th>
                    <th class="font-weight-bold" style="width: 7%">Weight</th>
                    <th class="font-weight-bold text-center" style="width: 1%">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="table-padding-0 uppecase autocomplete customer" style="width: 25%;" contenteditable=""></td>
                    <td class="table-padding-0 uppecase contact next-column" style="width: 10%;" contenteditable=""></td>
                    <td class="table-padding-0 uppecase dash-validate next-column" style="width: 5%;" contenteditable="">1</td>
                    <td class="table-padding-0 autocomplete uppecase special product-name" style="width: 25%;" contenteditable=""></td>
                    <td class="table-padding-0 autocomplete uppecase special category" style="width: 10%;" contenteditable=""></td>
                    <td class="table-padding-0 next-column text-right doubletd" style="width: 10%;" contenteditable=""></td>
                    <td class="table-padding-0 text-center autocomplete uppecase unit next-column" style="width: 7%;" contenteditable="">PCS</td>
                    <td class="table-padding-0 text-right doubletd create" style="width: 7%;" contenteditable=""></td>
                    <td class="table-padding-0 text-center" style="width: 1%; padding: 0"><button class="btn btn-inverse-danger btn-rounded p-10 remove-row"><i class="mdi mdi-delete-variant"></i></button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <button class="btn btn-outline-dark btn-icon-text float-right m-l-20" id="save-shipment">
            <i class="mdi mdi-content-save-settings btn-icon-prepend mdi-24px"></i>
            <span class="d-inline-block text-left font-weight-bold">Save<small class="font-weight-light d-block m-t-3">ctrl+s</small></span>
        </button>

        <div class="floating-chat bg-danger enter">
            <i class="mdi mdi-repeat mdi-24px"></i>
            <div class="chat">
                <div class="header">
                    <span class="title">
                        <i class="mdi mdi-repeat mdi-24px"></i> Find and Replace <small id="findCount">0/0</small>
                    </span>
                    <button class="button">
                        <i class="fa fa-times" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="messages">
                    <div class="form-group">
                        <div class="autocomplete">
                            <label for="findProduct">Find Product</label>
                            <input type="text" class="form-control" id="findProduct" placeholder="Find Product" autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="autocomplete">
                            <label for="replaceProduct">Replace Product</label>
                            <input type="text" class="form-control" id="replaceProduct" placeholder="Replace Product" autocomplete="off">
                        </div>
                    </div>
                    <button class="btn btn-inverse-dark btn-block btn-sm" id="findNext">
                        <i class="fa fa-search btn-icon-prepend" aria-hidden="true"></i>
                        <span class="d-inline-block text-left font-weight-bold">Find Next</span>
                    </button>
                    <button class="btn btn-outline-dark btn-block btn-sm" id="replace">
                        <i class="mdi mdi-reply btn-icon-prepend mdi-24px"></i>
                        <span class="d-inline-block text-left font-weight-bold">Replace</span>
                    </button>
                    <button class="btn btn-outline-dark btn-block btn-sm" id="replaceAll">
                        <i class="mdi mdi-reply-all btn-icon-prepend mdi-24px"></i>
                        <span class="d-inline-block text-left font-weight-bold">Replace All</span>
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>





<div class="shippingprocess-editExporter"></div>
<div class="shippingprocess-addProduct"></div>
<div class="shipmetnattachement-modal"></div>

<script src="/app/js/shippingInput/ShippingInput.js"></script>
